<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <!-- Dark Liquid Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0b162c"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Water Liquid Glow Orbs -->
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="80%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#e100ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Water Glass Border Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glass Refraction Sheen -->
    <linearGradient id="glass-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Badge Glass Fill -->
    <linearGradient id="badge-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Filter Blur for Ambient Liquid Light -->
    <filter id="liquid-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <!-- Drop Shadow Filter for Glass Cards -->
    <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.1); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-25px, 15px) scale(1.08); }
      }
      .orb-1 { animation: floatOrb1 12s ease-in-out infinite; transform-origin: center; }
      .orb-2 { animation: floatOrb2 14s ease-in-out infinite; transform-origin: center; }
      .title-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        font-size: 34px;
        fill: url(#text-grad);
      }
      .subtitle-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #e2e8f0;
        letter-spacing: 0.5px;
      }
      .tag-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #94a3b8;
      }
      .status-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="850" height="300" rx="24" fill="url(#bg-grad)"/>

  <!-- Liquid Ambient Orbs -->
  <circle class="orb-1" cx="180" cy="90" r="140" fill="url(#cyan-glow)" filter="url(#liquid-blur)"/>
  <circle class="orb-2" cx="700" cy="210" r="160" fill="url(#purple-glow)" filter="url(#liquid-blur)"/>

  <!-- Main Frosted Water Glass Card -->
  <rect x="30" y="30" width="790" height="240" rx="20" fill="rgba(255, 255, 255, 0.04)" stroke="url(#glass-border)" stroke-width="1.5" filter="url(#glass-shadow)"/>
  
  <!-- Glass Top Reflection Sheen -->
  <path d="M 30,50 Q 30,30 50,30 L 800,30 Q 820,30 820,50 L 820,120 Q 425,70 30,120 Z" fill="url(#glass-sheen)"/>

  <!-- Decorative Water Liquid Wave Accent in Glass Card -->
  <path d="M 50,220 C 200,190 350,250 500,210 C 650,170 750,230 800,200 L 800,250 L 50,250 Z" fill="rgba(0, 242, 254, 0.03)"/>

  <!-- Top Status Badge (Water Glass Capsule) -->
  <g transform="translate(540, 52)">
    <rect width="260" height="32" rx="16" fill="url(#badge-glass)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="20" cy="16" r="4.5" fill="#22c55e"/>
    <circle cx="20" cy="16" r="8" fill="#22c55e" opacity="0.3"/>
    <text x="36" y="20" class="status-text">Available for New Projects</text>
  </g>

  <!-- Profile Title & Avatar Icon -->
  <g transform="translate(65, 95)">
    <!-- Water Drop Decorative Icon -->
    <g transform="translate(0, 0)">
      <rect width="46" height="46" rx="14" fill="url(#badge-glass)" stroke="url(#glass-border)" stroke-width="1"/>
      <path d="M 23,12 C 23,12 14,24 14,29 C 14,34 18,37 23,37 C 28,37 32,34 32,29 C 32,24 23,12 23,12 Z" fill="url(#text-grad)"/>
    </g>
    
    <!-- Text Content -->
    <text x="62" y="34" class="title-text">Hi, I'm Natnael Abebe 👋</text>
  </g>

  <!-- Subtitle / Role -->
  <g transform="translate(65, 160)">
    <text x="0" y="0" class="subtitle-text">🚀 Full Stack Developer • Backend Specialist • UI/UX Craftsman</text>
    <text x="0" y="26" class="tag-text" fill="#cbd5e1">Building high-performance web applications with Laravel 12 &amp; Vue.js</text>
  </g>

  <!-- Water Glass Pill Tags (Bottom row inside card) -->
  <g transform="translate(65, 222)">
    <!-- Pill 1: QMT Tech -->
    <g transform="translate(0, 0)">
      <rect width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">💼 Developer @ QMT</text>
    </g>

    <!-- Pill 2: Latest Project -->
    <g transform="translate(150, 0)">
      <rect width="180" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#a855f7">🌐 Eschool-Link System</text>
    </g>

    <!-- Pill 3: Tech Focus -->
    <g transform="translate(340, 0)">
      <rect width="150" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#f43f5e">⚡ Vue 3 &amp; Laravel 12</text>
    </g>

    <!-- Pill 4: Hobbies -->
    <g transform="translate(500, 0)">
      <rect width="120" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="14" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24">♟️ Chess Enthusiast</text>
    </g>
  </g>
</svg>
