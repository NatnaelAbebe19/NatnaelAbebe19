<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" width="100%" height="100%">
  <defs>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="pipeline-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="chess-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#ffffff"/>
      <rect x="12" y="12" width="12" height="12" fill="#ffffff"/>
    </pattern>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      
      .line-num { fill: #484f58; font-size: 11.5px; user-select: none; }
      .code { font-size: 12.2px; }
      .kw { fill: #ff7b72; }
      .var { fill: #79c0ff; }
      .prop { fill: #d2a8ff; }
      .str { fill: #a5d6ff; }
      .comment { fill: #6e7681; font-style: italic; }
      .punct { fill: #c9d1d9; }

      .section-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #38bdf8; }
      .card-title { font-size: 13.5px; font-weight: 700; fill: #f0f6fc; }
      .node-title { font-size: 11.5px; font-weight: 700; fill: #e6edf3; }
      .node-sub { font-size: 9.5px; font-weight: 500; fill: #8b949e; }
      .body-text { font-size: 12px; fill: #c9d1d9; }
      .muted-text { font-size: 11px; fill: #8b949e; }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.8); opacity: 0; }
      }
      @keyframes flowPacket {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(210px); opacity: 0; }
      }

      .cursor { animation: blink 1.1s infinite; }
      .status-ring { animation: pulse 2.2s ease-out infinite; }
      .packet { animation: flowPacket 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Main Background Canvas -->
  <rect width="850" height="270" rx="18" fill="url(#canvas-bg)" stroke="#21262d" stroke-width="1"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="180" cy="80" r="180" fill="url(#glow-cyan)"/>
  <circle cx="700" cy="200" r="180" fill="url(#glow-purple)"/>

  <!-- ========================================================= -->
  <!-- LEFT CARD: macOS Code Editor Window (natnael.ts)          -->
  <!-- ========================================================= -->
  <g transform="translate(18, 18)">
    <rect width="466" height="234" rx="14" fill="#0d1117" fill-opacity="0.88" stroke="url(#card-border)" stroke-width="1.2"/>
    
    <!-- Editor Title Bar -->
    <path d="M 0,14 Q 0,0 14,0 L 452,0 Q 466,0 466,14 L 466,36 L 0,36 Z" fill="#161b22"/>
    <line x1="0" y1="36" x2="466" y2="36" stroke="#21262d" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="38" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="56" cy="18" r="5.5" fill="#27c93f"/>

    <!-- Active File Tab -->
    <rect x="78" y="6" width="116" height="30" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <rect x="78" y="34" width="116" height="3" fill="#0d1117"/>
    <text x="94" y="24" class="mono" font-size="11.5" font-weight="600" fill="#e6edf3">natnael.ts</text>
    <circle cx="178" cy="20" r="3" fill="#38bdf8"/>

    <!-- Editor Meta -->
    <text x="385" y="23" class="mono" font-size="10.5" fill="#6e7681">UTF-8 • TS</text>

    <!-- Code Content -->
    <g transform="translate(18, 60)" class="mono code">
      <!-- Line 1 -->
      <text x="0" y="0" class="line-num">01</text>
      <text x="28" y="0" class="comment">// "I can, because I did."</text>

      <!-- Line 2 -->
      <text x="0" y="21" class="line-num">02</text>
      <text x="28" y="21">
        <tspan class="kw">const</tspan> <tspan class="var">natnael</tspan> <tspan class="punct">=</tspan> <tspan class="punct">{</tspan>
      </text>

      <!-- Line 3 -->
      <text x="0" y="42" class="line-num">03</text>
      <text y="42">
        <tspan x="42" class="prop">role</tspan><tspan class="punct">:</tspan>
        <tspan x="116" class="str">"Full-Stack Developer @ QMT"</tspan><tspan class="punct">,</tspan>
      </text>

      <!-- Line 4 -->
      <text x="0" y="63" class="line-num">04</text>
      <text y="63">
        <tspan x="42" class="prop">grad</tspan><tspan class="punct">:</tspan>
        <tspan x="116" class="str">"B.Sc. Software Eng (Honors)"</tspan><tspan class="punct">,</tspan>
      </text>

      <!-- Line 5 -->
      <text x="0" y="84" class="line-num">05</text>
      <text y="84">
        <tspan x="42" class="prop">stack</tspan><tspan class="punct">:</tspan>
        <tspan x="116" class="punct">[</tspan><tspan class="str">"Laravel"</tspan><tspan class="punct">,</tspan> <tspan class="str">"Vue"</tspan><tspan class="punct">,</tspan> <tspan class="str">"React"</tspan><tspan class="punct">,</tspan> <tspan class="str">"SQL"</tspan><tspan class="punct">],</tspan>
      </text>

      <!-- Line 6 -->
      <text x="0" y="105" class="line-num">06</text>
      <text y="105">
        <tspan x="42" class="prop">shipping</tspan><tspan class="punct">:</tspan>
        <tspan x="116" class="punct">[</tspan><tspan class="str">"Eschool-Link"</tspan><tspan class="punct">,</tspan> <tspan class="str">"Haleta ERP"</tspan><tspan class="punct">],</tspan>
      </text>

      <!-- Line 7 -->
      <text x="0" y="126" class="line-num">07</text>
      <text y="126">
        <tspan x="42" class="prop">offHours</tspan><tspan class="punct">:</tspan>
        <tspan x="116" class="str">"Rapid chess &amp; UI experiments ♟️"</tspan>
      </text>

      <!-- Line 8 -->
      <text x="0" y="147" class="line-num">08</text>
      <text x="28" y="147" class="punct">};</text>
      <rect x="46" y="135" width="7" height="14" fill="#38bdf8" class="cursor"/>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT TOP CARD: End-to-End Workflow Pipeline              -->
  <!-- ========================================================= -->
  <g transform="translate(500, 18)">
    <rect width="332" height="110" rx="14" fill="#0d1117" fill-opacity="0.88" stroke="url(#card-border)" stroke-width="1.2"/>

    <text x="20" y="25" class="sans section-tag">HOW I WORK</text>
    <text x="102" y="25" class="sans muted-text">•  From blank canvas to production</text>

    <!-- Connecting Track Line -->
    <line x1="60" y1="68" x2="272" y2="68" stroke="#21262d" stroke-width="2.5" stroke-dasharray="4 4"/>
    <line x1="60" y1="68" x2="272" y2="68" stroke="url(#pipeline-line)" stroke-width="2" opacity="0.45"/>
    
    <!-- Animated Data Packet -->
    <circle cx="60" cy="68" r="4" fill="#38bdf8" class="packet"/>

    <!-- Step 1: Figma -->
    <g transform="translate(18, 42)">
      <rect width="88" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="44" y="23" text-anchor="middle" class="sans node-title">🎨 Figma</text>
      <text x="44" y="39" text-anchor="middle" class="sans node-sub">UI &amp; Wireframes</text>
    </g>

    <!-- Step 2: Frontend -->
    <g transform="translate(122, 42)">
      <rect width="88" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="44" y="23" text-anchor="middle" class="sans node-title">⚡ Vue / React</text>
      <text x="44" y="39" text-anchor="middle" class="sans node-sub">Interactive UI</text>
    </g>

    <!-- Step 3: Backend -->
    <g transform="translate(226, 42)">
      <rect width="88" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="44" y="23" text-anchor="middle" class="sans node-title">⚙️ Laravel</text>
      <text x="44" y="39" text-anchor="middle" class="sans node-sub">APIs &amp; Schema</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT BOTTOM CARD: Live Production & Chess Corner         -->
  <!-- ========================================================= -->
  <g transform="translate(500, 142)">
    <rect width="332" height="110" rx="14" fill="#0d1117" fill-opacity="0.88" stroke="url(#card-border)" stroke-width="1.2"/>

    <!-- Subtle Chessboard Watermark in Bottom-Right -->
    <g transform="translate(250, 28)" opacity="0.045">
      <rect width="72" height="72" rx="8" fill="url(#chess-grid)"/>
    </g>

    <!-- Live Status Indicator -->
    <g transform="translate(22, 26)">
      <circle cx="0" cy="0" r="8" fill="#22c55e" class="status-ring"/>
      <circle cx="0" cy="0" r="4" fill="#22c55e"/>
    </g>
    <text x="36" y="30" class="sans section-tag" fill="#4ade80">CURRENTLY BUILDING @ QMT</text>

    <!-- Real Projects Info -->
    <text x="20" y="54" class="sans body-text" font-weight="600" fill="#f0f6fc">Eschool-Link OS &amp; Haleta ERP</text>
    <text x="20" y="72" class="sans muted-text">Powering 1,200+ students &amp; multi-branch EPOS workflows</text>

    <!-- Bottom Badges -->
    <g transform="translate(20, 82)">
      <rect width="142" height="20" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="10" y="14" class="sans" font-size="10.5" font-weight="600" fill="#c9d1d9">🎓 Wollo Univ. Honors</text>

      <g transform="translate(150, 0)">
        <rect width="140" height="20" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="10" y="14" class="sans" font-size="10.5" font-weight="600" fill="#fde047">♟️ Down for 1v1 Chess</text>
      </g>
    </g>
  </g>
</svg>
